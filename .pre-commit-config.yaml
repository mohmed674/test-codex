# .pre-commit-config.yaml (مقتطف)
repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks: [{id: black}]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks: [{id: isort}]
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks: [{id: flake8}]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        args: ["--config-file", "mypy.ini"]
        additional_dependencies: ["django-stubs", "django-stubs-ext", "types-requests"]
