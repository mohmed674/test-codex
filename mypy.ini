[mypy]
python_version = 3.10
plugins = mypy_django_plugin.main

# عام
ignore_missing_imports = True
follow_imports = normal
strict_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
show_error_codes = True
explicit_package_bases = True

# استبعاد مسارات الضجيج (البيئة، البناء، المهاجرات، الاختبارات المؤقتة)
exclude = ^(\.venv/|venv/|env/|build/|dist/|.+/migrations/.+|.+/site-packages/.+|.+/Lib/site-packages/.+|.+/Scripts/.+)$

# إعدادات Django stubs
[mypy.plugins.django-stubs]
django_settings_module = config.settings

# استثناءات عامة
[mypy-tests.*]
ignore_errors = True

[mypy-*.migrations.*]
ignore_errors = True

[mypy-env.*]
ignore_errors = True

[mypy-tools.*]
ignore_errors = True

[mypy-*.management.commands.*]
ignore_errors = True

# تشديد وحدات مهمة
[mypy-apps.qms.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

# بقية التطبيقات أخف مؤقتًا
[mypy-apps.*]
disallow_untyped_defs = False
check_untyped_defs = False

# إسكات ملفات/مشاكل محددة من تقريرك مؤقتًا حتى نصلحها بالملفات
[mypy-apps.production.signals]
ignore_errors = True

[mypy-config.pytest_settings]
ignore_errors = True

[mypy-core.integrations.whatsapp]
ignore_errors = True
